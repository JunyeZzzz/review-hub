# 风险分级规则：路径和体量 -> 报告风险等级，由 app/engine/router.py 读取。
# 风险等级只供报告和人工优先级参考；所有等级都执行已启用的门禁与 AI 评审，
# Important 在所有等级下阻断。本文件不控制评审跳过或阻断策略。

version: 1

defaults:
  # 命中 high.paths 之前，diff 行数 >= medium_min_changed_lines 时升级为 medium
  base_tier: low
  medium_min_changed_lines: 400

tiers:
  # 全部改动都命中 trivial.paths -> trivial（仍执行 AI 评审）
  trivial:
    paths:
      - "**/*.md"
      - "docs/**"
      - "**/*.txt"
      - "**/*.svg"

  # 命中任意一条 -> high（用于报告风险标识）
  high:
    paths:
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
      - "**/auth/**"
      - "**/payment*/**"
      - "**/billing/**"
      - "**/permission*/**"
      - "migrations/**"
      - "**/migrations/**"
      - "infra/**"
      - "**/Dockerfile*"
      - "**/docker-compose*.yml"
