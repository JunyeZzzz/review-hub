<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Hub · 质量控制枢纽</title>
<style>
/* ============ 设计令牌 ============ */
:root {
  --bg: #101418;
  --bg-deep: #0B0E11;
  --panel: #161B21;
  --panel-2: #1C222A;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --text: #E9ECEF;
  --muted: #9AA4AE;
  --faint: #6B7681;
  --accent: #8FB7FF;
  --accent-ink: #111A2B;
  --ok: #3FB970;
  --bad: #E5544B;
  --warn: #C98A2D;
  --info: #6CA4D8;
  --sans: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --radius: 6px;
}
[data-theme="light"] {
  --bg: #F6F5F2;
  --bg-deep: #EFEDE8;
  --panel: #FFFFFF;
  --panel-2: #F1EFEA;
  --line: rgba(20,24,28,.12);
  --line-strong: rgba(20,24,28,.22);
  --text: #1B1F24;
  --muted: #5A636D;
  --faint: #8B949D;
  --accent: #245FB6;
  --accent-ink: #FFFFFF;
  --ok: #1E7F4C;
  --bad: #C03B32;
  --warn: #9A6A14;
  --info: #2B6398;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.75;
  min-height: 100%;
  display: flex;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; white-space: nowrap;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: var(--radius); padding: 5px 14px;
  transition: border-color .15s, background .15s, opacity .15s;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
button.ghost:hover { color: var(--text); border-color: var(--line-strong); }
button.danger-ghost { background: transparent; border-color: var(--line); color: var(--bad); }
input, select {
  font: inherit; color: var(--text);
  background: var(--bg-deep); border: 1px solid var(--line-strong);
  border-radius: var(--radius); padding: 6px 10px; width: 100%;
}
select {
  appearance:none; cursor:pointer; padding-right:31px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
select option { color:var(--text); background:var(--panel); }
input[type="checkbox"] {
  appearance:none; width:16px; height:16px; padding:0; flex:none; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--panel-2); border-radius:4px;
  display:inline-grid; place-items:center; vertical-align:middle;
}
input[type="checkbox"]:checked { background:var(--accent); border-color:var(--accent); }
input[type="checkbox"]:checked::after { content:""; width:8px; height:4px; border:solid var(--accent-ink);
  border-width:0 0 2px 2px; transform:rotate(-45deg) translateY(-1px); }
input[type="date"] { color-scheme:dark; }
[data-theme="light"] input[type="date"] { color-scheme:light; }
summary { list-style:none; }
summary::-webkit-details-marker { display:none; }
input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
::placeholder { color: var(--faint); }
.rh-dialog { width:min(440px,calc(100vw - 32px)); margin:auto; border:1px solid var(--line-strong);
  border-radius:10px; background:var(--panel); color:var(--text); padding:0; box-shadow:0 24px 80px rgba(0,0,0,.4); }
.rh-dialog::backdrop { background:rgba(0,0,0,.64); backdrop-filter:blur(3px); }
.rh-dialog-inner { padding:22px; }
.rh-dialog-title { font-size:17px; font-weight:650; margin-bottom:8px; }
.rh-dialog p { color:var(--muted); font-size:13px; line-height:1.55; white-space:pre-wrap; }
.rh-dialog-input { margin-top:15px; min-height:39px; }
.rh-dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
.rh-dialog-choices { display:flex; flex-direction:column; gap:7px; margin-top:17px; max-height:300px; overflow:auto; }
.rh-choice { width:100%; text-align:left; min-height:39px; }

/* ============ 布局骨架 ============ */
.sidebar {
  width: 190px; flex-shrink: 0; min-height: 100vh;
  background: var(--bg-deep); border-right: 1px solid var(--line);
  padding: 28px 0 20px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  animation: fadein .5s ease both;
}
.wordmark {
  font-family: var(--mono); font-size: 11px; letter-spacing: .34em;
  color: var(--accent); padding: 0 24px 4px; font-weight: 700;
}
.wordmark-sub { font-size: 11px; color: var(--faint); padding: 0 24px 28px; letter-spacing: .12em; }
nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
nav a {
  color: var(--muted); padding: 7px 12px; border-radius: var(--radius);
  text-decoration: none; font-size: 13.5px; display: flex; align-items: center; gap: 10px;
}
nav a .tick { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
nav a:hover { color: var(--text); background: var(--panel); text-decoration: none; }
nav a.active { color: var(--text); background: var(--panel); }
nav a.active .tick { background: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 16px 24px 0; font-size: 11px; color: var(--faint); line-height: 1.9; }
main { flex: 1; min-width: 0; padding: 28px 30px 72px; }
.wrap { max-width: 1660px; margin: 0 auto; }
.crumbs { font-size: 12px; color: var(--faint); margin-bottom: 6px; font-family: var(--mono); }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.page-head .sub { color: var(--muted); font-size: 13px; }
.stagger > * { animation: rise .45s ease both; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .12s; }
.stagger > *:nth-child(4) { animation-delay: .18s; }
.stagger > *:nth-child(5) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ============ 组件 ============ */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 28px; }
.stat { padding: 18px 20px 14px; }
.stat .num { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.2; }
.stat .label { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.sec-title {
  font-family: var(--mono); font-size: 11px; letter-spacing: .22em; color: var(--faint);
  text-transform: uppercase; margin: 34px 0 12px; display: flex; align-items: center; gap: 10px;
}
.sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr.rowlink { cursor: pointer; transition: background .12s; }
tbody tr.rowlink:hover { background: var(--panel-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.passed { background: var(--ok); }
.dot.blocked { background: var(--bad); }
.dot.failed { background: var(--faint); }
.dot.running { background: var(--accent); animation: pulse 1.2s ease infinite; }
.dot.queued { background: transparent; border: 1.5px solid var(--faint); }
.status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; }
.badge {
  display: inline-block; font-family: var(--mono); font-size: 11.5px;
  padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--muted);
}
.badge.imp { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.badge.nit { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.badge.pre { color: var(--faint); }
.badge.tier { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.badge.mock { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.proj-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
.proj-card + .proj-card { margin-top: 10px; }
.proj-card .name { font-weight: 600; font-size: 14.5px; }
.proj-card .meta { color: var(--muted); font-size: 12.5px; margin-top: 1px; word-break: break-all; }
.proj-card .grow { flex: 1; min-width: 0; }
.switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; cursor: pointer; }
.switch input { display: none; }
.switch .track { position: absolute; inset: 0; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line-strong); transition: background .15s; }
.switch .knob { position: absolute; top: 2.5px; left: 3px; width: 13px; height: 13px; border-radius: 50%; background: var(--faint); transition: all .15s; }
.switch input:checked + .track { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
.switch input:checked + .track .knob { left: 17px; background: var(--accent); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.banner { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--radius); margin-bottom: 22px; border: 1px solid; }
.banner.passed { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.banner.blocked { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.banner.failed { border-color: var(--line-strong); background: var(--panel-2); }
.banner.running { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.banner .mark { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.banner.passed .mark { background: var(--ok); }
.banner.blocked .mark { background: var(--bad); }
.banner.failed .mark { background: var(--faint); }
.banner.running .mark { background: var(--accent); animation: pulse 1.2s ease infinite; }
.failure-triage-state { margin-top:7px; color:var(--muted); font-size:11.5px; }
.failure-history { margin-top:7px; color:var(--muted); font-size:11px; }
.failure-history summary { cursor:pointer; color:var(--accent); }
.failure-history > div { padding:3px 0 0 12px; }
.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 8px 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
.step-main, .step details { min-width:0; }
.step .sname { overflow-wrap:anywhere; }
.step:last-child { border-bottom: none; }
.step .rail { position: relative; display: flex; justify-content: center; }
.step .rail::before { content: ""; position: absolute; top: -13px; bottom: -13px; width: 1px; background: var(--line); }
.step:first-child .rail::before { top: 50%; }
.step:last-child .rail::before { bottom: 50%; }
.step .sdot { position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--bg); border: 1.5px solid var(--faint); }
.step.s-ok .sdot { background: var(--ok); border-color: var(--ok); }
.step.s-fail .sdot { background: var(--bad); border-color: var(--bad); }
.step.s-skip .sdot { background: var(--faint); border-color: var(--faint); opacity: .5; }
.step.s-running .sdot { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s ease infinite; }
.step .sname { font-weight: 550; }
.step .sinfo { color: var(--muted); font-size: 12.5px; }
.step details { grid-column: 2 / -1; }
.step details, .step pre { max-width:100%; }
.step summary { cursor: pointer; color: var(--accent); font-size: 12px; font-family: var(--mono); user-select: none; list-style: none; }
.step summary::before { content: "▸ "; }
.step details[open] summary::before { content: "▾ "; }
.step pre {
  margin-top: 8px; background: var(--bg-deep); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; font-family: var(--mono);
  font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  max-height: 420px; overflow: auto; color: var(--text);
}
table.findings td { font-size: 13px; }
table.findings .fname { font-family: var(--mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 18px; font-size: 13px; }
.kv dt { color: var(--faint); }
.kv dd { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: none; }
.check .cmark { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
.check.ok .cmark { color: var(--ok); }
.check.no .cmark { color: var(--bad); }
.check .ctitle { font-weight: 550; }
.check .chint { color: var(--muted); font-size: 12.5px; }
.empty { padding: 40px 20px; text-align: center; color: var(--faint); font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 50;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-left: 2px solid var(--accent); border-radius: var(--radius);
  padding: 12px 18px; max-width: 420px; font-size: 13px;
  animation: rise .3s ease both;
}
.toast.err { border-left-color: var(--bad); }
/* ============ 变更上下文（报告单头） ============ */
.ctx { padding: 18px 20px; }
.ctx-row { display: flex; gap: 36px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.ctx-item { min-width: 0; }
.ctx-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; margin-bottom: 5px; }
.branch-chip {
  font-family: var(--mono); font-size: 12.5px; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 4px; padding: 1px 8px;
}
.diffstat { display: flex; align-items: center; gap: 7px; }
.diffstat .bar { width: 54px; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; display: inline-block; }
.diffstat .bar i { display: block; height: 100%; }
.bar-add { background: var(--ok); }
.bar-del { background: var(--bad); }
.add { color: var(--ok); }
.del { color: var(--bad); }
.commit-block { padding-top: 14px; }
.commit-subject { font-size: 15px; font-weight: 600; margin-top: 2px; text-wrap: pretty; }
.commit-body {
  margin-top: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.8;
  color: var(--muted); white-space: pre-wrap; word-break: break-word;
  background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 14px;
}
.ctx-cell .subject { color: var(--muted); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============ 评审步骤的结构化输出 ============ */
.step-main { margin-top: 8px; }
.review-summary {
  font-size: 13px; line-height: 1.85; color: var(--text);
  background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 14px; text-wrap: pretty;
}
.mini-findings { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.mini-finding {
  display: flex; align-items: baseline; gap: 10px; font-size: 12.5px;
  padding: 5px 10px; border-radius: 4px; background: var(--panel-2);
}
.mini-finding .small { min-width:0; overflow-wrap:anywhere; }
.mini-finding .mono { color: var(--muted); flex-shrink: 0; }
.step details { margin-top: 8px; }
.step summary { cursor: pointer; color: var(--accent); font-size: 12px; font-family: var(--mono); user-select: none; list-style: none; }
.step summary::before { content: "▸ "; }
.step details[open] summary::before { content: "▾ "; }
.step pre {
  margin-top: 8px; background: var(--bg-deep); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; font-family: var(--mono);
  font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  max-height: 420px; overflow: auto; color: var(--text);
}

/* ============ 审查报告：紧凑清单，按需看完整内容 ============ */
.finding-group-title { margin:18px 0 8px; letter-spacing:.08em; }
.finding-group-title .small { color:var(--text); letter-spacing:0; }
.finding-list { overflow:hidden; margin-bottom:15px; }
.finding-row { border-bottom:1px solid var(--line); }
.finding-row:last-child { border-bottom:0; }
.finding-row.f-imp { box-shadow:inset 3px 0 var(--bad); }
.finding-row.f-nit { box-shadow:inset 3px 0 var(--info); }
.finding-row-main { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 14px; align-items:center; padding:9px 12px; }
.finding-row-info { min-width:0; }
.finding-row-title { display:flex; align-items:center; gap:7px; min-width:0; }
.finding-row-title strong { min-width:0; font-size:12.5px; font-weight:620; line-height:1.45;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.finding-severity { flex:none; font:650 10px/1.3 var(--mono); color:var(--muted); }
.finding-severity.imp { color:var(--bad); }
.finding-severity.nit { color:var(--info); }
.finding-row-meta { display:flex; gap:9px; align-items:center; min-width:0; margin-top:3px; font-size:10.5px; color:var(--faint); }
.finding-row-meta .fname { font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.finding-row-meta > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.finding-row-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; }
.finding-row-actions button { min-height:28px; padding:3px 8px; font-size:11px; }
.finding-row-actions .fr-copy { background:color-mix(in srgb,var(--accent) 12%,var(--panel)); color:var(--accent);
  border-color:color-mix(in srgb,var(--accent) 42%,var(--line)); font-weight:650; }
.finding-row-detail { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:11px 13px 14px;
  border-top:1px solid var(--line); background:var(--bg-deep); }
.finding-row-detail[hidden] { display:none; }
.finding-row-detail .f-key { display:block; font:600 10px/1.4 var(--mono); letter-spacing:.08em; color:var(--faint); margin-bottom:5px; }
.finding-row-detail p { font-size:12px; line-height:1.65; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.run-workbench-link { display:inline-flex; align-items:center; padding:5px 11px;
  border:1px solid var(--line-strong); border-radius:var(--radius); color:var(--muted); text-decoration:none; }
.run-workbench-link:hover { color:var(--text); text-decoration:none; border-color:var(--accent); }

/* ============ 项目画像 ============ */
.proj-card-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.proj-card-wrap + .proj-card-wrap { margin-top: 10px; }
.proj-card-wrap .proj-card { border: none; border-radius: 0; }
.proj-card-wrap .proj-card + .profile-block { border-top: 1px solid var(--line); }
.profile-block { padding: 12px 20px 14px; }
.profile-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.profile-text { font-size: 13px; line-height: 1.8; color: var(--text); text-wrap: pretty; }
.profile-edit {
  width: 100%; font: inherit; font-size: 13px; line-height: 1.7; color: var(--text);
  background: var(--bg-deep); border: 1px solid var(--line-strong);
  border-radius: var(--radius); padding: 8px 10px; resize: vertical;
}
.small-btn { padding: 2px 10px; font-size: 12px; }

/* ============ 全局反馈：顶部进度条 / 返回键 / 骨架屏 / 过渡 ============ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100;
  background: transparent; overflow: hidden; pointer-events: none;
}
#topbar::before {
  content: ""; display: block; height: 100%; width: 30%;
  background: var(--accent); opacity: 0; transform: translateX(-100%);
}
#topbar.on::before { opacity: 1; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }
.back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); }
.back-btn:hover { color: var(--text); }
.view-enter { animation: fadein .22s ease; }
.skel { padding: 8px 0; }
.skel-line { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--panel-2) 25%, var(--panel) 50%, var(--panel-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; margin-bottom: 12px; }
.skel-panel { height: 90px; border-radius: var(--radius); background: linear-gradient(90deg, var(--panel-2) 25%, var(--panel) 50%, var(--panel-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; margin-bottom: 16px; }
.skel-panel.h2 { height: 200px; }
.skel-line.w30 { width: 30%; } .skel-line.w60 { width: 60%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
tr.rowlink .go { color: var(--faint); opacity: 0; transition: opacity .12s; font-family: var(--mono); font-size: 12px; }
tr.rowlink:hover .go { opacity: 1; color: var(--accent); }
.goto-hint { color: var(--faint); font-family: var(--mono); font-size: 12px; }
tr.rowlink:hover .goto-hint { color: var(--accent); }

/* ============ 移动端顶栏 ============ */
.mobilebar { display: none; }
@media (max-width: 900px) {
  .mobilebar {
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 40; width: 100%;
    background: var(--bg-deep); border-bottom: 1px solid var(--line);
    padding: 10px 16px;
  }
  .mobilebar .wordmark { padding: 0; }
  .mobilebar nav { flex-direction: row; padding: 0; gap: 4px; }
  .mobilebar nav a { padding: 4px 8px; font-size: 12px; }
  body { flex-direction: column; }
  main { padding-top: 20px; }
}

/* ============ 思考过程时间线 / 流水线编辑器 ============ */
.trace { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px;
  border-left: 2px solid var(--line-strong); padding-left: 14px; }
.tr-think, .tr-tool, .tr-text, .tr-meta {
  display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; line-height: 1.7;
}
.tr-think span:last-child { color: var(--muted); font-style: italic; text-wrap: pretty; min-width:0; overflow-wrap:anywhere; }
.tr-tool .mono:first-of-type { color: var(--info); }
.tr-tool .mono:last-of-type { word-break: break-all; }
.tr-meta { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
.tr-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; flex-shrink: 0;
  color: var(--faint); border: 1px solid var(--line-strong);
  border-radius: 3px; padding: 0 5px;
}
.tr-think .tr-tag { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.pipe-step { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; transition: border-color .15s, background .15s;
  display:flex; align-items:center; gap:14px; min-width:0; }
.pipe-step.drag-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.pipe-step.off { opacity: .5; }
.pipe-handle { cursor: grab; color: var(--faint); font-size: 14px; user-select: none; padding: 0 2px; }
.pipe-handle:active { cursor: grabbing; color: var(--accent); }
.node-flow-intro { color:var(--muted); font-size:12px; padding:4px 0 14px; }
.node-order { display:flex; flex-direction:column; align-items:center; color:var(--faint); font:600 14px var(--mono); min-width:24px; }
.node-body { flex:1; min-width:0; }
.node-title { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
.node-title strong { font-size:13px; }
.node-kind { font:600 10px/1.3 var(--mono); padding:3px 7px; border-radius:3px; color:var(--muted); background:var(--panel-2); border:1px solid var(--line); }
.node-kind.gate { color:var(--warn); }.node-kind.api { color:var(--accent); }.node-kind.reviewer { color:var(--ok); }
.node-purpose { font-size:10.5px; color:var(--faint); }
.node-description { font-size:11.5px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.node-actions { display:flex; align-items:center; gap:5px; }
.node-actions label { padding:5px; cursor:pointer; }
.node-actions button { min-height:29px; padding:3px 8px; }
.node-connector { height:25px; display:flex; align-items:center; padding-left:45px; color:var(--faint); font:10px var(--mono); }
.review-stage { border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line)); border-radius:8px;
  background:color-mix(in srgb,var(--accent) 4%,var(--panel)); padding:15px; min-width:0; }
.review-stage-head { display:flex; align-items:start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.review-stage-head > div { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.review-stage-head strong { font-size:14px; }
.review-stage-head small { flex-basis:100%; color:var(--muted); font-size:11px; }
.review-scroll-hint { display:none; color:var(--faint); font-size:10px; margin-bottom:6px; }
.node-kind.review { color:var(--accent); }
.review-members { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,1fr); gap:9px;
  overflow-x:auto; padding-bottom:3px; }
.review-member { display:flex; flex-direction:column; min-width:210px; min-height:120px; padding:11px;
  border:1px solid var(--line-strong); border-radius:6px; background:var(--panel); }
.review-member.off { opacity:.5; }
.review-member-top { display:flex; justify-content:space-between; align-items:center; }
.review-member > strong { font-size:12px; margin-top:7px; }
.review-member > small { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.review-member-actions { display:flex; align-items:center; justify-content:flex-end; gap:4px; margin-top:auto; padding-top:9px; }
.review-member-actions label { margin-right:auto; padding:4px; cursor:pointer; }
.review-member-actions button { min-height:27px; padding:3px 7px; }
.node-dialog { width:min(620px,calc(100vw - 24px)); max-height:calc(100vh - 30px); overflow:auto; }
.node-dialog-head { display:flex; justify-content:space-between; align-items:start; margin-bottom:18px; }
.node-dialog-head h2 { font-size:19px; margin-top:4px; }
.node-field { display:block; margin:12px 0; }
.node-field > span { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
.node-field small { display:block; color:var(--faint); font-size:11px; margin-top:4px; line-height:1.45; }
.node-field textarea { width:100%; resize:vertical; min-height:105px; padding:9px; color:var(--text); background:var(--bg-deep); border:1px solid var(--line-strong); border-radius:var(--radius); font:inherit; }
.choice-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:6px; }
.choice-grid .choice-tile { position:relative; display:block; margin:0; cursor:pointer; }
.choice-tile input[type="radio"] { position:absolute; opacity:0; width:1px; height:1px; padding:0; pointer-events:none; }
.choice-tile span { display:flex; align-items:center; min-height:35px; padding:7px 10px; border:1px solid var(--line-strong); border-radius:6px; background:var(--panel-2); color:var(--muted); font-size:11.5px; line-height:1.3; }
.choice-tile:hover span { border-color:var(--accent); color:var(--text); }
.choice-tile input:checked + span { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,var(--panel-2)); color:var(--text); }
.choice-tile input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.field-label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
.provider-choice { grid-template-columns:repeat(2,minmax(0,1fr)); max-height:180px; overflow:auto; padding:2px; }
.model-credential-list { margin:5px 0; }
.model-credential-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
.model-credential-row .mc-identity { min-width:0; flex:1; }
.model-credential-row .mc-controls { display:grid; justify-items:end; gap:6px; min-width:310px; }
.check-line { display:flex; gap:6px; align-items:center; }
.check-line input { width:170px; min-height:30px; font-size:11px; }
.check-status { font-size:11px; line-height:1.5; color:var(--muted); }
.check-detail { display:block; max-width:440px; overflow-wrap:anywhere; }
.agent-check-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
.agent-check-card { padding:14px 18px; display:grid; gap:9px; align-content:start; }
.agent-check-card > div:first-child { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.agent-check-card strong { font-size:12px; }
.agent-check-card button { justify-self:start; }
.model-credential-row strong, .model-credential-row small { display:block; }
.model-credential-row strong { font-size:12px; }
.model-credential-row small { font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
.model-credential-add { padding-top:16px; }
.model-credential-add .hint { display:inline-block; margin-left:10px; }
.trace-wrap > summary { cursor: pointer; color: var(--accent); font-family: var(--mono);
  font-size: 12px; user-select: none; list-style: none; }
.trace-wrap > summary::before { content: "▸ "; }
.trace-wrap[open] > summary::before { content: "▾ "; }
.ph-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ph-hint { font-size: 12px; color: var(--muted); }
.ph-chip {
  display: inline-flex; align-items: center; gap: 6px; cursor: grab;
  font-size: 12px; padding: 3px 10px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent);
  user-select: none; transition: background .15s, border-color .15s;
}
.ph-chip:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.ph-chip:active { cursor: grabbing; }
.ph-chip code { font-family: var(--mono); font-size: 11px; }
.ph-chip.miss { color: var(--bad); border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 8%, transparent); animation: pulse 1.2s ease infinite; }
.ph-status { margin-top: 8px; }
.prompt-editor { min-height: 300px; max-height: 560px; overflow: auto; white-space: pre-wrap; }
.ph-chip.inline { margin: 0 3px; padding: 1px 8px; font-size: 11.5px; vertical-align: baseline; display: inline-block; }
body.no-anim .stagger > * { animation: none !important; }
body.no-anim .wrap { animation: none !important; }
body.nav-anim .wrap { animation: fadein .25s ease; }
body.nav-anim .stagger > * { animation: rise .45s ease both; }
body.nav-anim .stagger > *:nth-child(2) { animation-delay: .06s; }
body.nav-anim .stagger > *:nth-child(3) { animation-delay: .12s; }
body.nav-anim .stagger > *:nth-child(4) { animation-delay: .18s; }
body.nav-anim .stagger > *:nth-child(5) { animation-delay: .24s; }

/* ============ 指标页 / 点击下钻 ============ */
.stat.clickable { cursor: pointer; transition: border-color .15s; }
.stat.clickable:hover { border-color: var(--accent); }
.mbar { display: inline-block; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 65%, transparent); vertical-align: middle; min-width: 2px; }
.mbar.bad { background: color-mix(in srgb, var(--bad) 60%, transparent); }
.mrow { display: flex; align-items: center; gap: 8px; }

/* ============ 配置中心 Tab / 统一提示 ============ */
.tabs { display: flex; gap: 2px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 8px 16px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); text-decoration: none; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.hint { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--faint); line-height: 1.6; }
.hint::before { content: "ⓘ"; font-family: var(--mono); flex-shrink: 0; opacity: .8; }

/* ============ 门禁与处置标记 ============ */
.badge.gate { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.badge.confirmed { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.badge.fp { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.stats.five { grid-template-columns: repeat(5, minmax(0,1fr)); }
.stats.five .num { font-size: 26px; }
.mark-btn.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.f-mark { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; align-items: center; gap: 8px; }
.f-mark .small-btn { padding: 1px 10px; font-size: 11.5px; }

/* ============ 质量工作台：行动优先，报告负责细节 ============ */
.wb-eyebrow { font:600 10px/1.4 var(--mono); letter-spacing:.16em; color:var(--accent); }
.wb-queue-empty { padding:15px 0; color:var(--faint); font-size:12px; }
.qa-page { min-width:0; }
.qa-page-head { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:18px; }
.qa-page-head h1 { font-size:25px; line-height:1.25; margin:4px 0; letter-spacing:-.02em; }
.qa-page-head p { color:var(--muted); font-size:12.5px; }
.qa-all-link { font-size:12px; white-space:nowrap; }
.qa-hero-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr); gap:12px; }
.qa-mission { padding:23px 26px; min-height:205px; display:flex; flex-direction:column; align-items:start;
  background:linear-gradient(130deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel) 72%);
  border-color:color-mix(in srgb,var(--accent) 32%,var(--line)); }
.qa-mission.attention { background:linear-gradient(130deg,color-mix(in srgb,var(--bad) 10%,var(--panel)),var(--panel) 70%);
  border-color:color-mix(in srgb,var(--bad) 34%,var(--line)); }
.qa-kicker { font:600 11px/1.4 var(--mono); letter-spacing:.05em; color:var(--accent); }
.qa-mission.attention .qa-kicker { color:var(--bad); }
.qa-mission h2 { font-size:22px; line-height:1.35; margin:10px 0 6px; letter-spacing:-.02em; }
.qa-mission p { color:var(--muted); font-size:13px; margin-bottom:17px; }
.qa-mission button, .qa-primary-link { margin-top:auto; min-height:36px; padding:6px 15px; }
.qa-primary-link { display:inline-flex; align-items:center; border-radius:var(--radius); background:var(--accent);
  color:var(--accent-ink); font-weight:650; text-decoration:none; }
.qa-primary-link:hover { text-decoration:none; filter:brightness(1.08); }
.qa-snapshot { padding:19px 20px; }
.qa-snapshot h2 { font-size:13px; margin-bottom:12px; }
.qa-snapshot-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-top:1px solid var(--line); padding:9px 0; font-size:12px; color:var(--muted); }
.qa-snapshot-row strong { color:var(--text); font:650 19px/1.2 var(--mono); text-align:right; }
.qa-snapshot-row .qa-snapshot-result { font-size:11px; max-width:145px; }
.qa-loop { margin-top:22px; }
.qa-section-heading { display:flex; justify-content:space-between; align-items:end; gap:14px; margin-bottom:10px; }
.qa-section-heading h2 { font-size:17px; margin-top:3px; }
.qa-section-heading p { color:var(--muted); font-size:11.5px; }
.qa-loop-lanes { display:grid; gap:8px; }
.qa-loop-lane { display:grid; grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) 24px minmax(0,1fr);
  align-items:stretch; gap:6px; }
.qa-loop-lane > div { min-width:0; border:1px solid var(--line); border-radius:var(--radius); padding:10px 13px;
  background:var(--panel); display:grid; grid-template-columns:1fr auto; align-content:start; gap:2px 9px; }
.qa-loop-lane > div span { color:var(--muted); font-size:11px; }
.qa-loop-lane > div strong { grid-column:2; grid-row:1/3; font:650 24px/1.2 var(--mono); }
.qa-loop-lane > div small { color:var(--faint); font-size:10.5px; }
.qa-loop-lane.positive .qa-loop-sample { border-color:color-mix(in srgb,var(--ok) 35%,var(--line)); }
.qa-loop-lane.negative .qa-loop-sample { border-color:color-mix(in srgb,var(--bad) 35%,var(--line)); }
.qa-loop-lane.positive .qa-loop-sample strong { color:var(--ok); }
.qa-loop-lane.negative .qa-loop-sample strong { color:var(--bad); }
.qa-loop-arrow { align-self:center; justify-self:center; color:var(--accent); font:700 18px var(--mono); }
.qa-loop-foot { display:flex; align-items:center; gap:12px; margin-top:8px; border:1px dashed var(--line-strong);
  border-radius:var(--radius); padding:8px 13px; color:var(--muted); font-size:11px; }
.qa-loop-foot span:nth-child(2) { color:var(--accent); }
.qa-loop-foot a { margin-left:auto; white-space:nowrap; }
.qa-operate-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:12px; margin-top:22px; }
.qa-operate { padding:16px 18px; min-width:0; }
.qa-card-heading { display:flex; justify-content:space-between; gap:10px; align-items:start; margin-bottom:12px; }
.qa-card-heading h3 { font-size:14px; }
.qa-card-heading p { font-size:11.5px; color:var(--muted); margin-top:2px; }
.qa-card-heading a { font-size:11.5px; white-space:nowrap; }
.qa-task-list { border-top:1px solid var(--line); }
.qa-task-row { min-height:58px; padding:9px 0; display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line); }
.qa-task-row:last-child { border-bottom:0; }
.qa-task-dot { width:7px; height:7px; background:var(--faint); border-radius:50%; flex:none; }
.qa-task-dot.alert { background:var(--bad); }
.qa-task-main { display:flex; flex-direction:column; min-width:0; flex:1; }
.qa-task-main strong { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qa-task-main span { font-size:11px; color:var(--muted); }
.qa-task-row a { font-size:11px; white-space:nowrap; }
.qa-task-row button { flex:none; }
.qa-empty { padding:16px 0; color:var(--faint); font-size:12px; }
.qa-eval-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.qa-status { font-size:13px; font-weight:650; color:var(--ok); }
.qa-status.warn { color:var(--bad); }
.qa-eval-flow { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:11px 0; }
.qa-eval-flow > div { min-width:0; padding:8px; border:1px solid var(--line); border-radius:5px; background:var(--bg-deep); }
.qa-eval-flow b,.qa-eval-flow span { display:block; font-size:10.5px; line-height:1.35; }
.qa-eval-flow b { color:var(--text); }
.qa-eval-flow span { color:var(--muted); margin-top:4px; }
.qa-eval-live { border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line)); border-radius:6px;
  padding:10px; margin-top:10px; background:color-mix(in srgb,var(--accent) 6%,var(--panel)); }
.qa-eval-live-head { display:flex; justify-content:space-between; gap:8px; font-size:11px; }
.qa-eval-live-head span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.qa-progress { height:5px; background:var(--bg-deep); border-radius:5px; overflow:hidden; margin:8px 0 5px; }
.qa-progress i { display:block; height:100%; background:var(--accent); border-radius:5px; transition:width .3s; }
.qa-eval-live small { color:var(--accent); font-size:11px; }
#qa-eval-status > p { color:var(--muted); font-size:12px; margin-top:10px; }
.qa-eval-counts { display:flex; gap:16px; margin-top:9px; font-size:11.5px; color:var(--muted); }
.qa-eval-counts b { color:var(--text); font-family:var(--mono); }
.qa-eval-note { margin-top:9px; padding:8px 10px; border-radius:4px; background:color-mix(in srgb,var(--warn) 9%,transparent);
  color:var(--warn); font-size:11.5px; }
.qa-eval-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; }
.qa-eval-actions button { min-height:32px; }
.qa-details { padding:17px 18px; margin-top:12px; }
.qa-details[hidden] { display:none; }
.qa-details-head { display:flex; justify-content:space-between; align-items:start; gap:10px; border-bottom:1px solid var(--line); padding-bottom:11px; }
.qa-details-head h3 { font-size:14px; }
.qa-details-head p { font-size:11.5px; color:var(--muted); margin-top:2px; }
.qa-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding-top:13px; }
.qa-detail-grid h4 { font-size:12px; color:var(--muted); margin-bottom:8px; }
.qa-case-row { min-height:37px; display:flex; align-items:center; gap:9px; border-top:1px solid var(--line);
  font-size:11.5px; min-width:0; }
.qa-case-row a, .qa-case-row > span:nth-child(2) { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qa-case-row .badge { flex:none; }
.qa-case-row button { padding:1px 7px; }
.qa-current-trace { padding:10px 0; border-bottom:1px solid var(--line); font-size:11px; }
.qa-current-trace > span { color:var(--accent); margin-left:8px; }
.qa-current-trace > div,.qa-trace { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.qa-trace-step { border:1px solid var(--line); border-radius:4px; padding:3px 6px; font:10px var(--mono); color:var(--muted); }
.qa-trace-step.ok { color:var(--ok); }.qa-trace-step.fail { color:var(--bad); }.qa-trace-step.running { color:var(--accent); }
.qa-result-row { border-top:1px solid var(--line); padding:7px 0; }
.qa-result-row summary { cursor:pointer; display:flex; align-items:center; gap:7px; list-style:none; min-width:0; }
.qa-result-row summary strong { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; }
.qa-result-row summary > span:last-child { flex:none; }
.qa-result-detail { padding:7px 4px 3px; color:var(--muted); font-size:11px; }
.qa-result-detail p { color:var(--text); }
.qa-result-detail small { display:block; margin-top:7px; overflow-wrap:anywhere; }
.qa-trend { margin-top:12px; padding:15px 18px; display:grid; grid-template-columns:minmax(210px,.9fr) minmax(0,1.5fr); gap:18px; }
.qa-trend-head h3 { font-size:13px; }
.qa-trend-head p { font-size:11.5px; color:var(--muted); line-height:1.5; margin:4px 0 8px; }
.qa-trend-head > span { font:600 11px/1.4 var(--mono); color:var(--text); }
.qa-week-grid { display:flex; align-items:end; gap:12px; justify-content:flex-end; min-width:0; }
.qa-week { flex:1; max-width:74px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; font:10px var(--mono); color:var(--muted); }
.qa-week-bar { height:55px; width:100%; background:var(--bg-deep); border-radius:4px; display:flex; align-items:end; overflow:hidden; }
.qa-week-bar i { display:block; width:100%; background:var(--accent); border-radius:4px 4px 0 0; }
.qa-week b { color:var(--text); font-size:10px; }
.qa-week span { font-size:9px; white-space:nowrap; }
/* 审查列表筛选直接可见，避免多层下拉菜单。 */
.rf-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 15px; margin-bottom:13px; }
.rf-chip-group, .rf-extra { display:flex; align-items:center; gap:7px; min-width:0; }
.rf-chip-group > span { color:var(--faint); font-size:11px; white-space:nowrap; }
.rf-chips { display:flex; flex-wrap:wrap; gap:3px; }
.rf-chip { background:transparent; border:1px solid var(--line); color:var(--muted);
  font-size:11px; min-height:29px; padding:3px 9px; }
.rf-chip.on { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  background:color-mix(in srgb,var(--accent) 9%,transparent); }
.rf-extra { margin-left:auto; }
.rf-extra label { display:flex; align-items:center; gap:5px; color:var(--muted); white-space:nowrap; }
.rf-extra input[type="date"] { width:135px; min-height:30px; font-size:11px; }
.run-cards-mobile { display:none; }
.run-card-mobile { display:flex; flex-direction:column; gap:5px; padding:12px 14px; color:var(--text); text-decoration:none; min-width:0; }
.run-card-mobile:hover { text-decoration:none; border-color:var(--accent); }
.run-card-mobile strong { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run-card-line { display:flex; justify-content:space-between; align-items:center; gap:8px; min-width:0; }
.run-card-sub { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run-layout { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(280px, .8fr); gap:18px; align-items:start; }
.run-diff-panel { margin-top:18px; padding:16px 20px; min-width:0; }
.run-diff-head { display:flex; justify-content:space-between; gap:16px; align-items:start; }
.run-diff-head h3 { font-size:15px; margin:0; }
.run-diff-head p { color:var(--warn); font-size:12px; margin:7px 0 0; }
.run-diff-content { max-height:65vh; overflow:auto; white-space:pre; font:11px/1.55 var(--mono); margin:14px 0 0; padding:14px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
.run-main, .finding-list { min-width:0; }
.run-layout .sec-title { margin-top:12px; }
.run-layout .run-side { position:sticky; top:18px; min-width:0; }
.run-side .ctx-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.run-side .ctx-item { min-width:0; }
.run-side .commit-block { overflow-wrap:anywhere; }
.proj-layout { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(275px,.8fr); gap:14px; align-items:start; }
#proj-list { display:grid; grid-template-columns:1fr; gap:12px; align-items:start; min-width:0; }
#proj-list .proj-card-wrap + .proj-card-wrap { margin-top:0; }
#proj-list .proj-card { flex-wrap:wrap; }
#proj-list .proj-card .actions { width:100%; justify-content:flex-start; }
#proj-list .profile-text { max-height:105px; overflow:auto; }
.proj-overview { padding:20px; min-width:0; }
.proj-overview h2 { font-size:17px; margin:3px 0 16px; }
.proj-overview-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
.proj-overview-stats div { padding:10px; border:1px solid var(--line); border-radius:4px; display:flex; flex-direction:column; }
.proj-overview-stats b { font:650 22px/1.1 var(--mono); }
.proj-overview-stats span { font-size:11px; color:var(--muted); margin-top:4px; }
.proj-overview-head { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding-bottom:9px; font-size:12px; }
.proj-overview-head a { font-size:11px; white-space:nowrap; }
.proj-connection { display:flex; gap:9px; align-items:start; padding:11px 0; border-bottom:1px solid var(--line); }
.proj-connection .dot { margin-top:6px; }
.proj-connection strong, .proj-connection small { display:block; }
.proj-connection strong { font-size:12px; }
.proj-connection small { font-size:11px; color:var(--muted); margin-top:2px; }
.proj-overview-note { color:var(--faint); font-size:11.5px; line-height:1.55; margin-top:13px; }

@media (max-width: 1080px) {
  .run-layout { grid-template-columns:minmax(0,1fr); }
  .run-layout .run-side { position:static; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .run-layout .run-side .sec-title { grid-column:span 1; margin:0; align-self:end; }
  .run-layout .run-side .panel { grid-row:2; }
  .proj-layout { grid-template-columns:1fr; }
  .proj-overview { max-width:none; }
}
@media (max-width: 900px) {
  .finding-row-main { grid-template-columns:1fr; }
  .finding-row-actions { justify-content:flex-start; }
  .ctx-row { gap: 18px; }
  .sidebar { display: none; }
  main { padding: 24px 18px 60px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stats.five { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .qa-hero-grid { grid-template-columns:1fr; }
  .qa-snapshot { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; align-items:center; }
  .qa-snapshot h2 { grid-column:1/-1; margin:0; }
  .qa-snapshot-row { display:block; border-top:0; padding:0; }
  .qa-snapshot-row strong { display:block; text-align:left; margin-top:4px; }
  .qa-operate-grid { grid-template-columns:1fr; }
  .run-layout .run-side { display:block; }
  #proj-list { grid-template-columns:1fr; }
  .rf-extra { margin-left:0; }
}
@media (max-width: 700px) {
  .run-table-desktop { display:none; }
  .run-cards-mobile { display:grid; gap:8px; }
}
@media (max-width: 480px) {
  main { padding:18px 12px 54px; }
  .qa-page-head { flex-wrap:wrap; }
  .qa-page-head h1 { font-size:22px; }
  .qa-mission { padding:18px; min-height:188px; }
  .qa-mission h2 { font-size:19px; }
  .qa-snapshot { padding:15px; }
  .qa-snapshot-row { font-size:10.5px; }
  .qa-snapshot-row .qa-snapshot-result { font-size:10px; }
  .qa-section-heading { display:block; }
  .qa-section-heading p { margin-top:4px; }
  .qa-loop-lane { grid-template-columns:1fr; gap:2px; }
  .qa-loop-arrow { transform:rotate(90deg); line-height:1; }
  .qa-loop-foot { display:block; }
  .qa-loop-foot span, .qa-loop-foot a { display:block; }
  .qa-detail-grid, .qa-trend { grid-template-columns:1fr; }
  .qa-task-row { flex-wrap:wrap; }.qa-task-row .qa-task-main { flex-basis:calc(100% - 18px); }
  .qa-eval-flow { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .qa-week-grid { justify-content:flex-start; }
  .finding-row-detail { grid-template-columns:1fr; }
  .rf-chip-group { width:100%; align-items:start; }
  .rf-chip-group > span { padding-top:7px; }
  .rf-chips { overflow-x:auto; flex-wrap:nowrap; max-width:calc(100vw - 70px); padding-bottom:2px; }
  .rf-chip { flex:none; }
  .rf-extra { flex-wrap:wrap; }
  .pipe-step { flex-wrap:wrap; }
  .node-body { flex-basis:calc(100% - 42px); }
  .node-actions { width:100%; justify-content:flex-end; flex-wrap:wrap; }
  .review-scroll-hint { display:block; }
  .model-credential-row { display:block; }
  .model-credential-row .mc-controls { justify-items:start; min-width:0; margin-top:8px; }
  .agent-check-grid { grid-template-columns:1fr; }
  .model-credential-row .actions { margin-top:7px; flex-wrap:wrap; }
  .model-credential-add .hint { display:block; margin:8px 0 0; }
}
